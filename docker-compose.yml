services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: anaher
      POSTGRES_USER: anaher
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "5432:5432"
    volumes:
      - anaher-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anaher -d anaher"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  anaher-postgres:
